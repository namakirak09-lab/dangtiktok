name: Android publisher smoke

on:
  push:
    branches: [android-publisher-lab]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Boot Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            adb wait-for-device
            adb shell getprop sys.boot_completed
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            adb shell wm size 1080x1920
            adb shell wm density 420
            adb shell screencap -p /sdcard/boot.png
            adb pull /sdcard/boot.png boot.png
            echo "Android emulator booted successfully"

      - name: Upload emulator proof
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-smoke
          path: boot.png
          if-no-files-found: error
