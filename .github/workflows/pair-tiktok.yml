name: Pair TikTok session

on:
  workflow_dispatch:
    inputs:
      pairing_id:
        description: Supabase pairing session id
        required: true
        type: string

permissions:
  contents: read

jobs:
  pair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PAIRING_ID: ${{ inputs.pairing_id }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SESSION_ENCRYPTION_KEY: ${{ secrets.SESSION_ENCRYPTION_KEY }}
      DISPLAY: :99
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Resolve Chrome
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME" ]; then echo "Chrome/Chromium not found"; exit 1; fi
          echo "CHROME_BIN=$CHROME" >> "$GITHUB_ENV"

      - name: Install remote desktop pieces
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb x11vnc novnc websockify
          curl -L --fail --silent --show-error \
            -o /tmp/cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i /tmp/cloudflared.deb

      - name: Start virtual desktop
        run: |
          export PAIR_VIEW_PASSWORD="$(openssl rand -hex 6)"
          echo "PAIR_VIEW_PASSWORD=$PAIR_VIEW_PASSWORD" >> "$GITHUB_ENV"
          Xvfb :99 -screen 0 1280x800x24 -ac > /tmp/xvfb.log 2>&1 &
          sleep 1
          x11vnc -storepasswd "$PAIR_VIEW_PASSWORD" /tmp/vnc.pass >/dev/null
          x11vnc -display :99 -rfbauth /tmp/vnc.pass -forever -shared -rfbport 5900 -noxdamage > /tmp/x11vnc.log 2>&1 &
          websockify --web=/usr/share/novnc/ 6080 localhost:5900 > /tmp/novnc.log 2>&1 &
          cloudflared tunnel --no-autoupdate --url http://127.0.0.1:6080 > /tmp/cloudflared.log 2>&1 &
          for i in $(seq 1 45); do
            URL=$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n1 || true)
            if [ -n "$URL" ]; then
              echo "PAIR_LIVE_URL=$URL/vnc.html?autoconnect=true&resize=scale" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/cloudflared.log
          exit 1

      - name: Pair through TikTok UI
        run: node automation/pair.mjs

      - name: Mark failure or cancel
        if: always() && (cancelled() || failure())
        run: |
          PAIR_STATUS=failed PAIR_ERROR="Runner ghép phiên dừng hoặc gặp sự cố. Kiểm tra GitHub Actions." node automation/update-pairing.mjs || true
