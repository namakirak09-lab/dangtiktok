name: TikTok Android app smoke

on:
  push:
    branches: [android-publisher-lab]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tiktok-app-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm

      - name: Install apkeep release binary
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/apkeep 'https://github.com/EFForg/apkeep/releases/download/1.0.0/apkeep-x86_64-unknown-linux-gnu'
          chmod +x /tmp/apkeep
          sudo install -m 0755 /tmp/apkeep /usr/local/bin/apkeep
          apkeep --version

      - name: Download TikTok APK and verify signer
        run: |
          set -euo pipefail
          mkdir -p apkout
          apkeep -a com.zhiliaoapp.musically -d apk-pure apkout
          find apkout -maxdepth 2 -type f -print
          apk=$(find apkout -type f -name '*.apk' | head -1)
          test -n "$apk"
          echo "TIKTOK_APK=$apk" >> "$GITHUB_ENV"
          aapt dump badging "$apk" | head -5
          pkg=$(aapt dump badging "$apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)
          test "$pkg" = 'com.zhiliaoapp.musically'
          cert=$(apksigner verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:upper:]' '[:lower:]' | head -1)
          echo "Signer SHA256=$cert"
          test "$cert" = '9041803e91bcb814b4b4399fb5c85a91640b755e5e8ba76813814bf4cf2ab5ba'

      - name: Boot Android 11 and launch TikTok
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-metrics
          disable-animations: true
          script: |
            set -euo pipefail
            adb wait-for-device
            test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
            echo 'Supported ABIs:'
            adb shell getprop ro.product.cpu.abilist
            adb install -r "$TIKTOK_APK"
            adb shell pm path com.zhiliaoapp.musically
            adb shell monkey -p com.zhiliaoapp.musically -c android.intent.category.LAUNCHER 1
            sleep 12
            adb shell uiautomator dump /sdcard/window.xml || true
            adb pull /sdcard/window.xml window.xml || true
            adb exec-out screencap -p > tiktok-launch.png
            test -s tiktok-launch.png
            echo 'TikTok launched.'

      - name: Upload proof
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-android-app-smoke
          path: |
            tiktok-launch.png
            window.xml
          if-no-files-found: error
