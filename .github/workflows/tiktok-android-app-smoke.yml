name: TikTok Android app smoke

on:
  push:
    branches: [android-publisher-lab]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tiktok-app-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm

      - name: Install apkeep release binary
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/apkeep 'https://github.com/EFForg/apkeep/releases/download/1.0.0/apkeep-x86_64-unknown-linux-gnu'
          chmod +x /tmp/apkeep
          sudo install -m 0755 /tmp/apkeep /usr/local/bin/apkeep
          apkeep --version

      - name: Download TikTok package and verify every APK signer
        run: |
          set -euo pipefail
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          APKSIGNER="$BUILD_TOOLS/apksigner"
          AAPT="$BUILD_TOOLS/aapt"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          echo "Using build tools: $BUILD_TOOLS"

          rm -rf apkout tiktok-splits
          mkdir -p apkout tiktok-splits
          apkeep -a com.zhiliaoapp.musically -d apk-pure apkout
          package=$(find apkout -type f \( -name '*.xapk' -o -name '*.apk' \) | head -1)
          test -n "$package"
          case "$package" in
            *.xapk) unzip -q "$package" -d tiktok-splits ;;
            *.apk) cp "$package" tiktok-splits/base.apk ;;
          esac
          find tiktok-splits -maxdepth 3 -type f -print
          mapfile -t apks < <(find tiktok-splits -type f -name '*.apk' | sort)
          test "${#apks[@]}" -gt 0
          base=''
          expected='9041803e91bcb814b4b4399fb5c85a91640b755e5e8ba76813814bf4cf2ab5ba'
          for apk in "${apks[@]}"; do
            verify_out=$("$APKSIGNER" verify --verbose --print-certs "$apk" 2>&1)
            cert=$(printf '%s\n' "$verify_out" | grep -m1 -E '(^| )Signer: certificate SHA-256 digest:' | sed 's/.*certificate SHA-256 digest: //' | tr '[:upper:]' '[:lower:]')
            if [ -z "$cert" ]; then
              echo "$verify_out"
              echo "Could not read signer digest for $apk" >&2
              exit 1
            fi
            echo "$(basename "$apk") signer=$cert"
            test "$cert" = "$expected"
            pkg=$("$AAPT" dump badging "$apk" 2>/dev/null | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1 || true)
            if [ "$pkg" = 'com.zhiliaoapp.musically' ]; then base="$apk"; fi
          done
          test -n "$base"
          "$AAPT" dump badging "$base" | head -8
          printf '%s\n' "${apks[@]}" > tiktok-apks.txt
          echo "TIKTOK_APK_LIST=$PWD/tiktok-apks.txt" >> "$GITHUB_ENV"

      - name: Boot ARM-compatible Android 11 and launch TikTok
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-metrics
          disable-animations: true
          script: |
            set -euo pipefail
            adb wait-for-device
            test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
            echo 'Supported ABIs:'
            adb shell getprop ro.product.cpu.abilist
            mapfile -t apks < "$TIKTOK_APK_LIST"
            adb install-multiple -r "${apks[@]}"
            adb shell pm path com.zhiliaoapp.musically
            adb shell monkey -p com.zhiliaoapp.musically -c android.intent.category.LAUNCHER 1
            sleep 15
            adb shell uiautomator dump /sdcard/window.xml || true
            adb pull /sdcard/window.xml window.xml || true
            adb exec-out screencap -p > tiktok-launch.png
            test -s tiktok-launch.png
            echo 'TikTok launched.'

      - name: Upload proof
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-android-app-smoke
          path: |
            tiktok-launch.png
            window.xml
          if-no-files-found: error
