name: Validate TikTok session

on:
  workflow_dispatch:
    inputs:
      runner_job_id:
        description: Supabase runner_jobs id
        required: true
        type: string
      account_id:
        description: TikTok account id
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      RUNNER_JOB_ID: ${{ inputs.runner_job_id }}
      ACCOUNT_ID: ${{ inputs.account_id }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SESSION_ENCRYPTION_KEY: ${{ secrets.SESSION_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Resolve Chrome
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe"
          )
          $chrome = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $chrome) { throw 'Google Chrome not found on windows-latest runner' }
          "CHROME_BIN=$chrome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate imported session
        shell: pwsh
        run: node automation/validate-session.mjs

      - name: Fail-safe runner state
        if: failure()
        shell: pwsh
        run: node automation/runner-failsafe.mjs
